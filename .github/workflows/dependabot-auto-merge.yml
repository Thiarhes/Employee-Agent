name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronized]

# Permissões necessárias para que o robô possa ler, assinar e aprovar o PR
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Executa apenas se o Pull Request foi aberto pelo robô oficial do dependabot
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Etapa que aprova e ativa o merge automático via CLI oficial do GitHub (gh)
      - name: Approve and Enable Auto-Merge
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
